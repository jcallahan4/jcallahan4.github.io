<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sensor Placement</title>
<!-- Office.js handshake so the page can run as a PowerPoint content add-in.
     Harmless in a normal browser; the page does not depend on it. -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script>if (window.Office && Office.onReady) { Office.onReady(function () {}); }</script>
<style>
  :root {
    --bg: #ffffff;
    --line: #c9ccd0;
    --line-faint: #edeef0;
    --text: #1a1d20;
    --text-dim: #6e7378;
    --accent: #dd8500;
    --signal: #18a05c;
    --font: "Helvetica Now Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }
  svg {
    display: block;
    width: 100%;
    height: 100%;
    font-family: var(--font);
    user-select: none;
    -webkit-user-select: none;
  }
  .label {
    fill: var(--text-dim);
    font-size: 10px;
    letter-spacing: 0.18em;
  }
  .readout {
    fill: var(--signal);
    font-size: 26px;
    letter-spacing: 0.04em;
  }
  .readout-unit {
    fill: var(--text-dim);
    font-size: 9px;
    letter-spacing: 0.18em;
  }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 960 252" preserveAspectRatio="xMidYMid meet" aria-label="Diagram: a source of unknown position somewhere on a line, and a single sensor whose reading is unknown.">

  <!-- faint vertical grid -->
  <g id="grid"></g>

  <!-- ground line -->
  <line x1="40" y1="190" x2="920" y2="190" stroke="var(--line)" stroke-width="1"/>
  <g id="axis-ticks"></g>

  <!-- ghost candidate sources (position unknown) -->
  <g id="ghosts"></g>
  <text class="label" x="40" y="244">SOURCE &#183; POSITION UNKNOWN</text>

  <!-- sensor (fixed) -->
  <g id="sensor-group">
    <line x1="0" y1="102" x2="0" y2="190" stroke="var(--text)" stroke-width="1.5"/>
    <path d="M -11 86 L 11 86 L 0 102 Z" fill="var(--text)"/>
    <text class="label" y="220" text-anchor="middle">SENSOR</text>

    <!-- readout box with corner brackets -->
    <rect x="-75" y="8" width="150" height="62" fill="#f6f6f4" stroke="var(--line)" stroke-width="1"/>
    <path fill="none" stroke="var(--signal)" stroke-width="1.5"
          d="M -75 18 V 8 H -65 M 65 8 H 75 V 18 M 75 60 V 70 H 65 M -65 70 H -75 V 60"/>
    <text class="readout-unit" x="0" y="26" text-anchor="middle">SIGNAL</text>
    <text class="readout" id="readout-value" x="0" y="55" text-anchor="middle">?</text>
  </g>
</svg>

<script>
(function () {
  "use strict";

  var ns = "http://www.w3.org/2000/svg";

  // --- world geometry -------------------------------------------------
  var PX0 = 40, PX1 = 920, GROUND = 190;
  var U0 = 0, U1 = 10;
  var pxPerUnit = (PX1 - PX0) / (U1 - U0);
  function unitToPx(u) { return PX0 + (u - U0) * pxPerUnit; }

  var SENSOR_U = 7.5;

  // --- axis ticks and faint vertical grid ------------------------------
  var ticks = document.getElementById("axis-ticks");
  var grid = document.getElementById("grid");
  for (var u = U0; u <= U1; u++) {
    var x = unitToPx(u);
    var t = document.createElementNS(ns, "line");
    t.setAttribute("x1", x); t.setAttribute("x2", x);
    t.setAttribute("y1", GROUND); t.setAttribute("y2", GROUND + 6);
    t.setAttribute("stroke", "var(--line)");
    t.setAttribute("stroke-width", "1");
    ticks.appendChild(t);

    var g = document.createElementNS(ns, "line");
    g.setAttribute("x1", x); g.setAttribute("x2", x);
    g.setAttribute("y1", 8); g.setAttribute("y2", GROUND);
    g.setAttribute("stroke", "var(--line-faint)");
    g.setAttribute("stroke-width", "1");
    grid.appendChild(g);
  }

  // --- sensor placement --------------------------------------------------
  document.getElementById("sensor-group")
    .setAttribute("transform", "translate(" + unitToPx(SENSOR_U) + ",0)");

  // --- ghost candidate sources ---------------------------------------------
  // (none directly under the sensor mast)
  var GHOST_U = [0.7, 1.8, 2.7, 3.9, 4.8, 6.1, 6.9, 8.4, 9.3];
  var ghostsGroup = document.getElementById("ghosts");
  var ghosts = [];
  GHOST_U.forEach(function (gu, i) {
    var c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", unitToPx(gu));
    c.setAttribute("cy", GROUND);
    c.setAttribute("r", 5);
    c.setAttribute("fill", "var(--accent)");
    ghostsGroup.appendChild(c);
    ghosts.push({ el: c, phase: i * 1.7 });
  });

  // --- ambient animation: ghosts pulse softly -------------------------------
  function frame(ts) {
    for (var i = 0; i < ghosts.length; i++) {
      var o = 0.12 + 0.16 * (0.5 + 0.5 * Math.sin(ts * 0.0012 + ghosts[i].phase));
      ghosts[i].el.setAttribute("opacity", o.toFixed(3));
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
