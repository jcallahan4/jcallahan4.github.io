<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expected Information Gain (Arizona)</title>
<link rel="stylesheet" href="boed-arizona.css">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script>if (window.Office && Office.onReady) Office.onReady(function () {});</script>
</head><body data-widget="expectation">
<main>
  <div class="controls">
    <span id="sample-count">Simulated experiments: 0</span>
    <span id="estimate">Mean information gain: —</span>
    <div class="fixed">d = 12<br>σ = 0.006</div>
    <button id="play" type="button" aria-label="Pause averaging">Pause</button>
  </div>
  <svg id="scene" viewBox="0 0 1040 300" role="img" aria-labelledby="title description">
    <title id="title">Average information gain over possible observations</title>
    <desc id="description">Independent hypothetical experiments produce different information gains. Individual gains and their running mean accumulate automatically. Every experiment starts from the same prior.</desc>
  </svg>
</main>
<script src="boed-arizona-model.js"></script><script src="boed-arizona-ui.js"></script>
</body></html>
