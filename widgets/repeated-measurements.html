<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repeated Measurements</title>
<!-- Office.js handshake so the page can run as a PowerPoint content add-in.
     Harmless in a normal browser; the page does not depend on it. -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script>if (window.Office && Office.onReady) { Office.onReady(function () {}); }</script>
<style>
  :root {
    --bg: #0b0c0e;
    --line: #3a3e44;
    --line-faint: #212429;
    --text: #e8e6e1;
    --text-dim: #8a8f96;
    --accent: #ffb000;
    --signal: #3ddc84;
    --font: "Helvetica Now Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: var(--font);
  }
  svg {
    display: block;
    width: 100%;
    height: 100%;
    font-family: var(--font);
    user-select: none;
    -webkit-user-select: none;
  }
  .label {
    fill: var(--text-dim);
    font-size: 10px;
    letter-spacing: 0.18em;
  }
  .tick-num {
    fill: var(--text-dim);
    font-size: 10px;
    letter-spacing: 0.08em;
  }
  .readout {
    fill: var(--signal);
    font-size: 26px;
    letter-spacing: 0.04em;
  }
  .readout-unit {
    fill: var(--text-dim);
    font-size: 9px;
    letter-spacing: 0.18em;
  }
  .marker-label {
    fill: var(--signal);
    font-size: 9px;
    letter-spacing: 0.18em;
  }
  .btn { cursor: pointer; }
  .btn rect { fill: transparent; stroke: var(--line); stroke-width: 1; }
  .btn text {
    fill: var(--text-dim);
    font-size: 10px;
    letter-spacing: 0.18em;
  }
  .btn:hover rect { stroke: var(--text-dim); }
  .btn:hover text { fill: var(--text); }
  .btn.primary rect { stroke: var(--signal); }
  .btn.primary text { fill: var(--signal); }
  .btn.primary:hover rect { fill: var(--signal); }
  .btn.primary:hover text { fill: var(--bg); }
  .bar {
    fill: var(--signal);
    fill-opacity: 0.22;
    stroke: var(--signal);
    stroke-opacity: 0.8;
    stroke-width: 1;
  }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 960 280" preserveAspectRatio="xMidYMid meet" aria-label="Interactive diagram: click Measure to draw a noisy reading from the sensor; each reading lands on a number line and fills its histogram bin, building a normal distribution around the model prediction.">

  <!-- control buttons -->
  <g id="btn-measure" class="btn primary">
    <rect x="20" y="14" width="92" height="28"/>
    <text x="66" y="32" text-anchor="middle">MEASURE</text>
  </g>
  <g id="btn-batch" class="btn primary">
    <rect x="20" y="50" width="92" height="28"/>
    <text x="66" y="68" text-anchor="middle">&#215;100</text>
  </g>
  <g id="btn-reset" class="btn">
    <rect x="20" y="86" width="92" height="28"/>
    <text x="66" y="104" text-anchor="middle">RESET</text>
  </g>

  <!-- left panel: sensor -->
  <g id="sensor-group">
    <line x1="0" y1="102" x2="0" y2="230" stroke="var(--text)" stroke-width="1.5"/>
    <path d="M -11 86 L 11 86 L 0 102 Z" fill="var(--text)"/>
    <text class="label" y="258" text-anchor="middle">SENSOR</text>

    <rect x="-75" y="8" width="150" height="62" fill="#111318" stroke="var(--line)" stroke-width="1"/>
    <path fill="none" stroke="var(--signal)" stroke-width="1.5"
          d="M -75 18 V 8 H -65 M 65 8 H 75 V 18 M 75 60 V 70 H 65 M -65 70 H -75 V 60"/>
    <text class="readout-unit" x="0" y="26" text-anchor="middle">SIGNAL</text>
    <text class="readout" id="readout-value" x="0" y="55" text-anchor="middle">&#8212; &#8212; &#8212;</text>
  </g>
  <line x1="130" y1="230" x2="290" y2="230" stroke="var(--line)" stroke-width="1"/>

  <!-- panel divider -->
  <line x1="302" y1="20" x2="302" y2="260" stroke="var(--line-faint)" stroke-width="1"/>

  <!-- right panel: histogram bars, then number line on top -->
  <g id="bars"></g>
  <line x1="330" y1="230" x2="920" y2="230" stroke="var(--line)" stroke-width="1"/>
  <g id="nl-ticks"></g>

  <!-- model prediction marker -->
  <line id="marker" y1="70" y2="230" stroke="var(--signal)" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <text class="marker-label" id="marker-label" y="58" text-anchor="middle">MODEL &#183; 0.250</text>

  <!-- dot count -->
  <text class="label" id="count-label" x="920" y="30" text-anchor="end">N = 0</text>

  <!-- flying / fading dots -->
  <g id="flying"></g>
</svg>

<script>
(function () {
  "use strict";

  var ns = "http://www.w3.org/2000/svg";

  // --- model -----------------------------------------------------------
  var MU = 0.250;       // model prediction g(theta)
  var SIGMA = 0.02;     // noise standard deviation
  var BIN = 0.01;       // histogram bin width

  // --- layout ------------------------------------------------------------
  var SENSOR_X = 210, GROUND = 230;
  var NL0 = 330, NL1 = 920;         // number line pixel extent
  var V0 = 0.15, V1 = 0.35;         // number line value extent
  var DOT_R = 5;
  var BIN_PX = BIN / (V1 - V0) * (NL1 - NL0);
  var MAX_BAR = GROUND - 84;        // tallest bar the panel allows

  function valToPx(v) { return NL0 + (v - V0) / (V1 - V0) * (NL1 - NL0); }

  document.getElementById("sensor-group")
    .setAttribute("transform", "translate(" + SENSOR_X + ",0)");

  // number line ticks: minor every 0.01, labeled every 0.05
  var nlTicks = document.getElementById("nl-ticks");
  for (var v = V0; v <= V1 + 1e-9; v += BIN) {
    var vv = Math.round(v * 100) / 100;
    var x = valToPx(vv);
    var major = Math.round(vv * 100) % 5 === 0;
    var t = document.createElementNS(ns, "line");
    t.setAttribute("x1", x); t.setAttribute("x2", x);
    t.setAttribute("y1", GROUND);
    t.setAttribute("y2", GROUND + (major ? 8 : 4));
    t.setAttribute("stroke", "var(--line)");
    t.setAttribute("stroke-width", "1");
    nlTicks.appendChild(t);
    if (major) {
      var n = document.createElementNS(ns, "text");
      n.setAttribute("class", "tick-num");
      n.setAttribute("x", x); n.setAttribute("y", GROUND + 24);
      n.setAttribute("text-anchor", "middle");
      n.textContent = vv.toFixed(2);
      nlTicks.appendChild(n);
    }
  }

  // model prediction marker
  var mx = valToPx(MU);
  var marker = document.getElementById("marker");
  marker.setAttribute("x1", mx); marker.setAttribute("x2", mx);
  document.getElementById("marker-label").setAttribute("x", mx);

  // --- state ---------------------------------------------------------------
  var readout = document.getElementById("readout-value");
  var barsGroup = document.getElementById("bars");
  var flyingGroup = document.getElementById("flying");
  var countLabel = document.getElementById("count-label");

  var counts = {};    // bin index -> landed count
  var barEl = {};     // bin index -> rect element
  var barH = {};      // bin index -> current animated height
  var barT = {};      // bin index -> target height
  var landed = 0;
  var seqIdx = 0;

  function ensureBar(bin) {
    if (barEl[bin]) return;
    var cx = valToPx(MU + bin * BIN);
    var r = document.createElementNS(ns, "rect");
    r.setAttribute("class", "bar");
    r.setAttribute("x", cx - BIN_PX / 2 + 1);
    r.setAttribute("width", BIN_PX - 2);
    r.setAttribute("y", GROUND);
    r.setAttribute("height", 0);
    barsGroup.appendChild(r);
    barEl[bin] = r;
    barH[bin] = 0;
    barT[bin] = 0;
  }

  // recompute every bar's target height; scale so the tallest always fits
  function retarget() {
    var maxC = 0, k;
    for (k in counts) maxC = Math.max(maxC, counts[k]);
    var unit = Math.min(16, maxC > 0 ? MAX_BAR / maxC : 16);
    for (k in counts) {
      ensureBar(k);
      barT[k] = counts[k] * unit;
    }
  }

  // --- randomness ------------------------------------------------------------
  function gauss() {
    var u1 = Math.random() || 1e-9, u2 = Math.random();
    return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  }

  // van der Corput sequence (base 2): 1/2, 1/4, 3/4, 1/8, 5/8, ...
  // Fills (0,1) evenly, so successive draws spread across the distribution
  // instead of possibly clumping at the mean for the first few clicks.
  function vdc(i) {
    var f = 0.5, r = 0;
    while (i > 0) {
      if (i & 1) r += f;
      i >>= 1;
      f /= 2;
    }
    return r;
  }

  // inverse normal CDF (Acklam's rational approximation)
  function probit(p) {
    var a = [-39.6968302866538, 220.946098424521, -275.928510446969,
             138.357751867269, -30.6647980661472, 2.50662827745924];
    var b = [-54.4760987982241, 161.585836858041, -155.698979859887,
             66.8013118877197, -13.2806815528857];
    var c = [-0.00778489400243029, -0.322396458041136, -2.40075827716184,
             -2.54973253934373, 4.37466414146497, 2.93816398269878];
    var d = [0.00778469570904146, 0.32246712907004, 2.445134137143, 3.75440866190742];
    var pl = 0.02425, q, r;
    if (p < pl) {
      q = Math.sqrt(-2 * Math.log(p));
      return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) /
             ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
    }
    if (p <= 1 - pl) {
      q = p - 0.5; r = q * q;
      return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q /
             (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
    }
    q = Math.sqrt(-2 * Math.log(1 - p));
    return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) /
            ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
  }

  // --- measurement flights ------------------------------------------------------
  var flights = [];
  var fades = [];

  function measure() {
    seqIdx++;
    var v = MU + SIGMA * probit(vdc(seqIdx)) + 0.0025 * gauss();
    v = Math.max(V0 + 0.003, Math.min(V1 - 0.003, v));
    readout.textContent = v.toFixed(3);

    var dot = document.createElementNS(ns, "circle");
    dot.setAttribute("r", DOT_R);
    dot.setAttribute("fill", "var(--signal)");
    flyingGroup.appendChild(dot);

    flights.push({
      el: dot, t: 0, dur: 650,
      x0: SENSOR_X, y0: 55,                     // leave from the signal box
      x1: valToPx(v), y1: GROUND - DOT_R,       // land on the number line
      bin: Math.round((v - MU) / BIN)
    });
  }

  function land(f) {
    counts[f.bin] = (counts[f.bin] || 0) + 1;
    retarget();
    landed++;
    countLabel.textContent = "N = " + landed;
    fades.push({ el: f.el, t: 0, dur: 450 });   // dot dissolves into the bar
  }

  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  var last = null;
  function frame(ts) {
    if (last === null) last = ts;
    var dt = ts - last;
    last = ts;

    // flying dots
    for (var i = flights.length - 1; i >= 0; i--) {
      var f = flights[i];
      f.t += dt;
      var p = Math.min(1, f.t / f.dur);
      var e = easeInOut(p);
      f.el.setAttribute("cx", f.x0 + (f.x1 - f.x0) * e);
      f.el.setAttribute("cy", f.y0 + (f.y1 - f.y0) * e - 60 * Math.sin(Math.PI * p));
      if (p >= 1) {
        land(f);
        flights.splice(i, 1);
      }
    }

    // landed dots fading into their bar
    for (var j = fades.length - 1; j >= 0; j--) {
      var fd = fades[j];
      fd.t += dt;
      var q = Math.min(1, fd.t / fd.dur);
      fd.el.setAttribute("opacity", (1 - q).toFixed(3));
      if (q >= 1) {
        fd.el.remove();
        fades.splice(j, 1);
      }
    }

    // bars easing toward their targets
    var k = 1 - Math.exp(-dt / 120);
    for (var bin in barT) {
      var cur = barH[bin], tgt = barT[bin];
      if (cur === tgt) continue;
      cur += (tgt - cur) * k;
      if (Math.abs(tgt - cur) < 0.15) cur = tgt;
      barH[bin] = cur;
      barEl[bin].setAttribute("y", GROUND - cur);
      barEl[bin].setAttribute("height", cur);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // --- controls -----------------------------------------------------------------
  document.getElementById("btn-measure").addEventListener("click", measure);

  function batch(n, gapMs) {
    for (var k = 0; k < n; k++) setTimeout(measure, k * gapMs);
  }
  document.getElementById("btn-batch").addEventListener("click", function () {
    batch(100, 18);
  });

  // hidden test hook: open with #demo to auto-generate a batch of readings
  if (location.hash === "#demo") batch(100, 18);

  document.getElementById("btn-reset").addEventListener("click", function () {
    flights.forEach(function (f) { f.el.remove(); });
    fades.forEach(function (f) { f.el.remove(); });
    flights = []; fades = [];
    while (barsGroup.firstChild) barsGroup.firstChild.remove();
    counts = {}; barEl = {}; barH = {}; barT = {};
    landed = 0; seqIdx = 0;
    countLabel.textContent = "N = 0";
    readout.textContent = "— — —";
  });
})();
</script>
</body>
</html>
