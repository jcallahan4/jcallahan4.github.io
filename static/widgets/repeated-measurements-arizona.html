<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repeated Measurements (Arizona)</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script>if (window.Office && Office.onReady) { Office.onReady(function () {}); }</script>
<style>
  :root {
    --navy: #0c234b;
    --red: #ac0520;
    --muted: #46556a;
    --line: #8b96a5;
    --faint: #e2e8eb;
    color: var(--navy);
    background: #fff;
    font-family: Aptos, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body, main { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  main { position: relative; }
  svg { display: block; width: 100%; height: 100%; }
  text { fill: var(--navy); font-size: 22px; }
  .tick { fill: var(--muted); font-size: 19px; }
  .bar { fill: var(--navy); fill-opacity: .2; stroke: var(--navy); stroke-opacity: .5; }
  .number { font-variant-numeric: tabular-nums; }
  #readout, #prediction { font-size: 35px; }
  #prediction { fill: var(--red); }
  #error-value { font-size: 28px; }
  button {
    position: absolute; right: 1%; bottom: 2%;
    font: inherit; font-size: clamp(12px, 2.2vw, 20px);
    color: var(--navy); background: #fff; border: 1px solid var(--line);
    border-radius: 3px; padding: 3px 9px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <svg id="scene" viewBox="0 0 920 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description">
    <title id="title">Repeated measurements at a fixed source and sensor</title>
    <desc id="description">The source and sensor remain fixed. Red indicates the exact predicted signal. Navy indicates noisy measurements. The signed measurement error is the measured value minus the predicted signal. Each measurement leaves the sensor head and enters the histogram. A Gaussian model, scaled to expected counts per bin, appears as measurements accumulate.</desc>
    <text x="130" y="27" text-anchor="middle">Fixed source and sensor</text>
    <line x1="35" y1="210" x2="235" y2="210" stroke="var(--line)" stroke-width="1.5"/>
    <g id="source" transform="translate(55,210)">
      <circle r="8" fill="var(--red)"/>
      <path d="M -24 0 A 24 24 0 0 1 24 0 M -45 0 A 45 45 0 0 1 45 0" fill="none" stroke="var(--red)" stroke-width="2" opacity=".4"/>
      <text y="38" text-anchor="middle" style="fill:var(--red)">Source</text>
    </g>
    <g id="sensor" transform="translate(190,210)">
      <line y1="-55" y2="0" stroke="var(--navy)" stroke-width="2.5"/>
      <path d="M -10 -65 L 10 -65 L 0 -51 Z" fill="var(--navy)"/>
      <circle id="sensor-pulse" r="15" fill="none" stroke="var(--navy)" stroke-width="2" opacity="0"/>
      <text y="38" text-anchor="middle">Sensor</text>
    </g>
    <rect x="3" y="62" width="114" height="80" rx="3" fill="var(--red)" fill-opacity=".08"/>
    <text x="60" y="87" text-anchor="middle" style="font-size:20px;fill:var(--red)">Signal</text>
    <text id="prediction" class="number" x="60" y="125" text-anchor="middle">0.040</text>
    <rect x="126" y="62" width="139" height="80" rx="3" fill="var(--faint)"/>
    <text x="195.5" y="87" text-anchor="middle" style="font-size:20px">Measurement</text>
    <text id="readout" class="number" x="195.5" y="125" text-anchor="middle">—</text>
    <text x="130" y="293" text-anchor="middle">Measurement error, ε</text>
    <text id="error-value" class="number" x="130" y="325" text-anchor="middle">—</text>
    <line x1="275" y1="55" x2="275" y2="327" stroke="var(--faint)"/>
    <text id="count" class="number" x="338" y="29">Measurements: 0</text>
    <g id="legend" opacity="0">
      <line x1="640" y1="22" x2="677" y2="22" stroke="var(--muted)" stroke-width="3"/>
      <text x="687" y="29">Gaussian model</text>
    </g>
    <g id="grid"/>
    <g id="bars"/>
    <path id="curve" fill="none" stroke="var(--muted)" stroke-width="3" opacity="0"/>
    <line id="model-marker" y1="62" y2="270" stroke="var(--red)" stroke-width="2" stroke-dasharray="4 5" opacity=".65"/>
    <line x1="338" x2="898" y1="270" y2="270" stroke="var(--line)" stroke-width="1.5"/>
    <g id="ticks"/>
    <text x="299" y="170" text-anchor="middle" transform="rotate(-90 299 170)">Count</text>
    <text x="618" y="345" text-anchor="middle">Measured signal, y</text>
    <circle id="signal-reference" cy="270" r="4" fill="var(--red)"/>
    <g id="flights" fill="var(--navy)"/>
    <circle id="latest" cy="270" r="5" fill="var(--navy)" visibility="hidden"/>
  </svg>
  <button id="play" type="button" aria-label="Pause measurements">Pause</button>
</main>
<script>
(function () {
  "use strict";
  var ns = "http://www.w3.org/2000/svg";
  // Match the initial configuration on slide 6: g(θ,d) = 1/|d-θ|².
  var sourcePosition = 2.5, sensorPosition = 7.5;
  var mean = 1 / Math.pow(sensorPosition - sourcePosition, 2);
  // Measurement model: Y = g(θ,d) + ε, with independent ε ~ N(0, σ²).
  var sigma = 0.006, binWidth = 0.002;
  var minimum = 0.01, maximum = 0.07;
  var left = 338, right = 898, ground = 270, plotHeight = 204, yMax = 10;
  // Sensor head center in SVG coordinates: (190, 210) + (0, -58).
  var sensorHeadX = 190, sensorHeadY = 152;
  var counts = new Map(), barNodes = new Map(), flights = [];
  var total = 0, drawn = 0, cycle = 0;
  var time = 0, nextDraw = 1800, lastFrame = null, lastMeasurement = -Infinity;
  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var playing = !reducedMotion;
  var button = document.getElementById("play");
  var scene = document.getElementById("scene");
  var readout = document.getElementById("readout");
  var latest = document.getElementById("latest");
  document.getElementById("prediction").textContent = mean.toFixed(3);

  // Box-Muller transform: Z = sqrt(-2 ln U₁) cos(2πU₂), with independent uniform U₁,U₂.
  function measurement() {
    var u1 = 1 - Math.random(), u2 = Math.random();
    return mean + sigma * Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  }
  // Normal density: p(y|θ,d) = exp(-(y-g(θ,d))²/(2σ²)) / (σ sqrt(2π)).
  function density(value) {
    var z = (value - mean) / sigma;
    return Math.exp(-0.5 * z * z) / (sigma * Math.sqrt(2 * Math.PI));
  }
  // Linear plot mappings: x = left + (value-min)/(max-min)·width; y = ground - count/yMax·height.
  function x(value) { return left + (value - minimum) / (maximum - minimum) * (right - left); }
  function y(count) { return ground - count / yMax * plotHeight; }
  function element(tag, attributes, parent, text) {
    var node = document.createElementNS(ns, tag);
    Object.keys(attributes).forEach(function (key) { node.setAttribute(key, attributes[key]); });
    if (text !== undefined) node.textContent = text;
    parent.appendChild(node);
    return node;
  }
  function axes() {
    var ticks = document.getElementById("ticks");
    ticks.replaceChildren();
    for (var value = minimum; value <= maximum + 1e-9; value += 0.01) {
      element("line", { x1: x(value), x2: x(value), y1: ground, y2: ground + 6, stroke: "var(--line)" }, ticks);
      element("text", { x: x(value), y: ground + 29, "text-anchor": "middle", class: "tick" }, ticks, value.toFixed(2));
    }
    var marker = document.getElementById("model-marker");
    marker.setAttribute("x1", x(mean)); marker.setAttribute("x2", x(mean));
    document.getElementById("signal-reference").setAttribute("cx", x(mean));
  }
  function render() {
    // Expected counts per narrow bin are approximately N·Δy·p(y|θ,d).
    var peak = total * binWidth * density(mean);
    var largest = Math.max(peak, 0, ...counts.values());
    yMax = Math.max(10, Math.ceil(largest * 1.1 / 10) * 10);
    var grid = document.getElementById("grid");
    grid.replaceChildren();
    [0, yMax / 2, yMax].forEach(function (count) {
      element("line", { x1: left, x2: right, y1: y(count), y2: y(count), stroke: "var(--faint)" }, grid);
      element("text", { x: left - 10, y: y(count) + 6, "text-anchor": "end", class: "tick" }, grid, count);
    });
    counts.forEach(function (count, bin) {
      if (!barNodes.has(bin)) barNodes.set(bin, element("rect", { class: "bar" }, document.getElementById("bars")));
      var bar = barNodes.get(bin);
      bar.setAttribute("x", x(bin * binWidth) + 1);
      bar.setAttribute("width", (right - left) * binWidth / (maximum - minimum) - 2);
      bar.setAttribute("y", y(count)); bar.setAttribute("height", ground - y(count));
      bar.dataset.count = count;
    });
    var path = "";
    for (var i = 0; i <= 240; i++) {
      var value = minimum + i / 240 * (maximum - minimum);
      path += (i ? " L " : "M ") + x(value).toFixed(2) + " " + y(total * binWidth * density(value)).toFixed(2);
    }
    document.getElementById("curve").setAttribute("d", path);
    var opacity = Math.max(0, Math.min(1, (total - 30) / 50));
    document.getElementById("curve").setAttribute("opacity", opacity);
    document.getElementById("legend").setAttribute("opacity", opacity);
    document.getElementById("count").textContent = "Measurements: " + total;
    scene.dataset.measurements = total; scene.dataset.cycle = cycle;
  }
  function land(value) {
    var bin = Math.floor(value / binWidth);
    counts.set(bin, (counts.get(bin) || 0) + 1);
    total++;
    latest.setAttribute("cx", x(value)); latest.setAttribute("visibility", "visible");
  }
  function draw() {
    var value = measurement();
    // Expand to include rare tail observations; never clip or discard generated measurements.
    var lower = Math.floor(value / 0.01) * 0.01, upper = Math.ceil(value / 0.01) * 0.01;
    if (value <= minimum || value >= maximum) {
      minimum = Math.min(minimum, lower - 0.01);
      maximum = Math.max(maximum, upper + 0.01);
      axes(); render();
    }
    readout.textContent = value.toFixed(3); readout.dataset.value = value;
    // Signed measurement error: ε = y - g(θ,d), displayed at the measurement precision.
    var error = Number((value - mean).toFixed(3));
    document.getElementById("error-value").textContent = (error > 0 ? "+" : "") + error.toFixed(3);
    var dot = element("circle", { cx: sensorHeadX, cy: sensorHeadY, r: 5 }, document.getElementById("flights"));
    flights.push({ value: value, born: time, dot: dot });
    drawn++; lastMeasurement = time;
  }
  function restart() {
    counts.clear(); barNodes.clear(); document.getElementById("bars").replaceChildren();
    total = 0; drawn = 0; cycle++;
    minimum = 0.01; maximum = 0.07;
    readout.textContent = "—"; delete readout.dataset.value;
    document.getElementById("error-value").textContent = "—";
    latest.setAttribute("visibility", "hidden");
    nextDraw = time + 1800;
    axes(); render();
  }
  function updateButton() {
    button.textContent = playing ? "Pause" : "Play";
    button.setAttribute("aria-label", playing ? "Pause measurements" : "Play measurements");
  }
  button.addEventListener("click", function () { playing = !playing; lastFrame = null; updateButton(); });
  document.addEventListener("visibilitychange", function () { lastFrame = null; });
  if (reducedMotion) {
    // Generate a static example through the same measurement and binning functions.
    for (var j = 0; j < 400; j++) {
      draw(); var flight = flights.pop(); land(flight.value); flight.dot.remove();
    }
    nextDraw = 12000;
  }
  axes(); render(); updateButton();
  function frame(now) {
    var elapsed = lastFrame === null || document.hidden ? 0 : Math.min(now - lastFrame, 100);
    lastFrame = now;
    if (playing && elapsed) {
      time += elapsed;
      while (drawn < 400 && time >= nextDraw) {
        draw();
        nextDraw += drawn < 6 ? 1600 : drawn < 100 ? 100 : 35;
      }
      var landed = false;
      flights = flights.filter(function (flight) {
        var progress = Math.min(1, (time - flight.born) / 650);
        // Smooth transfer from the sensor head to its histogram position: s(t) = 3t²-2t³.
        var s = progress * progress * (3 - 2 * progress);
        flight.dot.setAttribute("cx", sensorHeadX + (x(flight.value) - sensorHeadX) * s);
        flight.dot.setAttribute("cy", sensorHeadY + (ground - sensorHeadY) * s);
        if (progress < 1) return true;
        land(flight.value); landed = true; flight.dot.remove(); return false;
      });
      if (landed) render();
      document.getElementById("sensor-pulse").setAttribute("opacity", .6 * Math.max(0, 1 - (time - lastMeasurement) / 500));
      if (total === 400 && time >= nextDraw + 12000) restart();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
