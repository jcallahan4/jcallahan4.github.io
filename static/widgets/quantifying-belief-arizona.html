<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantifying Belief (Arizona)</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script>if (window.Office && Office.onReady) { Office.onReady(function () {}); }</script>
<style>
  :root {
    --navy: #0c234b;
    --red: #ac0520;
    --muted: #46556a;
    --line: #8b96a5;
    --faint: #e2e8eb;
    color: var(--navy);
    background: #fff;
    font-family: Aptos, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body, main { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  main { position: relative; }
  svg { display: block; width: 100%; height: 100%; }
  text { fill: var(--navy); font-size: 20px; }
  .tick { fill: var(--muted); font-size: 18px; }
  .bar { fill: var(--red); fill-opacity: .16; stroke: var(--red); stroke-opacity: .45; }
  #count, #sample-location { font-variant-numeric: tabular-nums; }
  button {
    position: absolute; right: 1%; top: 1%;
    font: inherit; font-size: clamp(12px, 1.8vw, 18px);
    color: var(--navy); background: #fff; border: 1px solid var(--line);
    border-radius: 3px; padding: 3px 9px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <svg id="scene" viewBox="0 0 1040 330" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description">
    <title id="title">Sampling from a belief distribution</title>
    <desc id="description">A probability density represents belief about one unknown source location. Dots mark sampled hypothetical source locations. Repeated samples form a histogram that approximates the fixed belief density.</desc>
    <line x1="76" y1="24" x2="116" y2="24" stroke="var(--navy)" stroke-width="3"/>
    <text x="126" y="31">Belief density</text>
    <rect class="bar" x="298" y="16" width="24" height="16"/>
    <text x="332" y="31">Sample density</text>
    <text id="count" x="570" y="31">Samples: 0</text>
    <g id="grid"/>
    <g id="bars" opacity="0"/>
    <path id="curve-fill" fill="var(--navy)" fill-opacity=".035"/>
    <path id="curve" fill="none" stroke="var(--navy)" stroke-width="3"/>
    <line x1="76" y1="238" x2="996" y2="238" stroke="var(--line)" stroke-width="1.5"/>
    <g id="ticks"/>
    <text x="23" y="150" text-anchor="middle" transform="rotate(-90 23 150)">Probability density</text>
    <text x="536" y="293" text-anchor="middle">Source location, θ</text>
    <g id="rug" fill="var(--red)" opacity=".45"/>
    <g id="flights" fill="var(--red)"/>
    <circle id="source" cy="238" r="6" fill="var(--red)" visibility="hidden"/>
    <text id="sample-location" x="536" y="324" text-anchor="middle">Hypothetical source: θ = —</text>
  </svg>
  <button id="play" type="button" aria-label="Pause sampling">Pause</button>
</main>
<script>
(function () {
  "use strict";
  var ns = "http://www.w3.org/2000/svg";
  var left = 76, right = 996, ground = 238, height = 174;
  var binWidth = 0.5, gridSize = 2000, step = 10 / gridSize;
  var weights = [0.6, 0.4], means = [3.6, 7.1], deviations = [1.1, 0.75];
  var densities = [], cumulative = [0], normalizer = 0;
  var counts = Array(20).fill(0), total = 0, flights = [], barNodes = [];
  var time = 0, nextDraw = 2400, lastFrame = null, drawn = 0, cycle = 0;
  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var playing = !reducedMotion;
  var playButton = document.getElementById("play");
  var source = document.getElementById("source");

  // Original belief model: q(θ) = Σᵢ wᵢ exp(-(θ-μᵢ)²/(2σᵢ²)) / (σᵢ√(2π)).
  // Normalize on the displayed region: p(θ) = q(θ) / ∫₀¹⁰ q(u) du.
  function unnormalized(theta) {
    return weights.reduce(function (sum, weight, i) {
      var z = (theta - means[i]) / deviations[i];
      return sum + weight * Math.exp(-0.5 * z * z) / (deviations[i] * Math.sqrt(2 * Math.PI));
    }, 0);
  }
  // Trapezoidal integration: Fⱼ = Fⱼ₋₁ + Δθ (qⱼ₋₁ + qⱼ) / 2.
  for (var i = 0; i <= gridSize; i++) {
    densities.push(unnormalized(i * step));
    if (i) {
      normalizer += step * (densities[i - 1] + densities[i]) / 2;
      cumulative.push(normalizer);
    }
  }
  cumulative = cumulative.map(function (value) { return value / normalizer; });
  function density(theta) { return unnormalized(theta) / normalizer; }
  // Inverse transform sampling: θ = F⁻¹(U), U uniformly distributed on [0, 1).
  function sampleTheta() {
    var u = Math.random(), lo = 0, hi = gridSize;
    while (hi - lo > 1) {
      var mid = (lo + hi) >> 1;
      if (cumulative[mid] < u) lo = mid; else hi = mid;
    }
    return (lo + (u - cumulative[lo]) / (cumulative[hi] - cumulative[lo])) * step;
  }
  // Display mappings: x = left + θ(right-left)/10; y = ground - height·p/yMax.
  function x(theta) { return left + theta * (right - left) / 10; }
  var yMax = 0.35;
  function y(value) { return ground - height * value / yMax; }
  function element(tag, attributes, parent, text) {
    var node = document.createElementNS(ns, tag);
    Object.keys(attributes).forEach(function (key) { node.setAttribute(key, attributes[key]); });
    if (text !== undefined) node.textContent = text;
    parent.appendChild(node);
    return node;
  }
  var ticks = document.getElementById("ticks");
  for (var theta = 0; theta <= 10; theta += 2) {
    element("line", { x1: x(theta), x2: x(theta), y1: ground, y2: ground + 6, stroke: "var(--line)" }, ticks);
    element("text", { x: x(theta), y: ground + 29, "text-anchor": "middle", class: "tick" }, ticks, theta);
  }
  counts.forEach(function (_, bin) {
    barNodes.push(element("rect", { class: "bar", x: x(bin * binWidth) + 1, width: (right - left) * binWidth / 10 - 2 }, document.getElementById("bars")));
  });
  function render() {
    // Histogram density hⱼ = nⱼ/(N·Δθ); its integrated area is one.
    var histogram = counts.map(function (count) { return total ? count / (total * binWidth) : 0; });
    var opacity = Math.max(0, Math.min(1, (total - 40) / 40));
    yMax = Math.max(0.35, opacity ? Math.max.apply(null, histogram) * 1.12 : 0);
    document.getElementById("bars").setAttribute("opacity", opacity);
    // Early samples appear as points; the histogram fades in as samples accumulate.
    document.getElementById("rug").setAttribute("opacity", .45 * (1 - opacity));
    barNodes.forEach(function (bar, bin) {
      // Hidden early bars have zero height, so they stay within the plot bounds.
      var value = opacity ? histogram[bin] : 0;
      bar.setAttribute("y", y(value));
      bar.setAttribute("height", ground - y(value));
    });
    var grid = document.getElementById("grid");
    grid.replaceChildren();
    [0.1, 0.2, 0.3].forEach(function (value) {
      element("line", { x1: left, x2: right, y1: y(value), y2: y(value), stroke: "var(--faint)" }, grid);
      element("text", { x: left - 10, y: y(value) + 5, "text-anchor": "end", class: "tick" }, grid, value.toFixed(1));
    });
    var path = "";
    for (var j = 0; j <= 240; j++) {
      var t = j / 24;
      path += (j ? " L " : "M ") + x(t).toFixed(2) + " " + y(density(t)).toFixed(2);
    }
    document.getElementById("curve").setAttribute("d", path);
    document.getElementById("curve-fill").setAttribute("d", path + " L " + right + " " + ground + " L " + left + " " + ground + " Z");
    document.getElementById("count").textContent = "Samples: " + total;
    document.getElementById("scene").dataset.samples = total;
    document.getElementById("scene").dataset.cycle = cycle;
  }
  function land(theta) {
    counts[Math.min(counts.length - 1, Math.floor(theta / binWidth))]++;
    total++;
    source.setAttribute("cx", x(theta));
    source.setAttribute("visibility", "visible");
    document.getElementById("sample-location").textContent = "Hypothetical source: θ = " + theta.toFixed(2);
    if (total <= 80) element("circle", { cx: x(theta), cy: ground + 2, r: 2.5 }, document.getElementById("rug"));
  }
  function draw() {
    var theta = sampleTheta();
    var dot = element("circle", { cx: x(theta), cy: y(density(theta)), r: 5 }, document.getElementById("flights"));
    flights.push({ theta: theta, born: time, dot: dot });
    drawn++;
  }
  function restart() {
    counts.fill(0); total = 0; drawn = 0; cycle++;
    document.getElementById("rug").replaceChildren();
    source.setAttribute("visibility", "hidden");
    document.getElementById("sample-location").textContent = "Hypothetical source: θ = —";
    nextDraw = time + 2400;
    render();
  }
  function updateButton() {
    playButton.textContent = playing ? "Pause" : "Play";
    playButton.setAttribute("aria-label", playing ? "Pause sampling" : "Play sampling");
  }
  playButton.addEventListener("click", function () { playing = !playing; lastFrame = null; updateButton(); });
  document.addEventListener("visibilitychange", function () { lastFrame = null; });
  if (reducedMotion) {
    for (var k = 0; k < 400; k++) land(sampleTheta());
    drawn = 400;
    nextDraw = 12000;
  }
  render();
  updateButton();
  function frame(now) {
    var elapsed = lastFrame === null || document.hidden ? 0 : Math.min(now - lastFrame, 100);
    lastFrame = now;
    if (playing && elapsed) {
      time += elapsed;
      while (drawn < 400 && time >= nextDraw) {
        draw();
        // First draws are separated for inspection; later draws build the histogram.
        nextDraw += drawn < 6 ? 1600 : drawn < 100 ? 100 : 35;
      }
      var landed = false;
      flights = flights.filter(function (flight) {
        var progress = Math.min(1, (time - flight.born) / 650);
        // Illustrative descent: y(t) = y₀ + (ground-y₀)t², t in [0, 1].
        var start = y(density(flight.theta));
        flight.dot.setAttribute("cy", start + (ground - start) * progress * progress);
        if (progress < 1) return true;
        land(flight.theta); landed = true; flight.dot.remove(); return false;
      });
      if (landed) render();
      if (total === 400 && time >= nextDraw + 12000) restart();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
