<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulated Experiment</title>
<!-- Office.js handshake so the page can run as a PowerPoint content add-in.
     Harmless in a normal browser; the page does not depend on it. -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script>if (window.Office && Office.onReady) { Office.onReady(function () {}); }</script>
<style>
  :root {
    --bg: #ffffff;
    --line: #9aa1a8;
    --line-faint: #e3e5e8;
    --text: #1a1d20;
    --text-dim: #5c6167;
    --accent: #dd8500;
    --signal: #18a05c;
    --posterior: #d0453e;
    --font: "Helvetica Now Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: var(--font);
  }
  svg {
    display: block;
    width: 100%;
    height: 100%;
    font-family: var(--font);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .label {
    fill: var(--text-dim);
    font-size: 10px;
    letter-spacing: 0.18em;
  }
  .tick-num {
    fill: var(--text-dim);
    font-size: 10px;
    letter-spacing: 0.08em;
  }
  .math-amber { fill: var(--accent); font-size: 12px; letter-spacing: 0.06em; }
  .math-red { fill: var(--posterior); font-size: 12px; letter-spacing: 0.06em; }
  .math-green { fill: var(--signal); font-size: 15px; letter-spacing: 0.06em; }
  .ig-entry { fill: var(--posterior); font-size: 13px; letter-spacing: 0.06em; }
  .eig-val { fill: var(--posterior); font-size: 17px; letter-spacing: 0.06em; font-weight: 500; }
  .kl-val { fill: var(--posterior); font-size: 22px; letter-spacing: 0.04em; }
  .btn { cursor: pointer; }
  .btn rect { fill: transparent; stroke: var(--line); stroke-width: 1.5; }
  .btn text { fill: var(--text-dim); font-size: 10px; letter-spacing: 0.18em; }
  .btn:hover text { fill: var(--text); }
  .btn.amber rect { stroke: var(--accent); } .btn.amber text { fill: var(--accent); }
  .btn.green rect { stroke: var(--signal); } .btn.green text { fill: var(--signal); }
  .btn.red rect { stroke: var(--posterior); } .btn.red text { fill: var(--posterior); }
  .btn.ink rect { stroke: var(--text); } .btn.ink text { fill: var(--text); }
  .btn.disabled { pointer-events: none; opacity: 0.35; }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 880 440" preserveAspectRatio="xMidYMid meet" aria-label="Interactive stepper: fix a sensor design, sample a hypothetical source from the prior, simulate a noisy observation, compute the posterior and its information gain, repeat, then average the gains into expected information gain.">

  <!-- controls -->
  <g id="btn-main" class="btn amber">
    <rect x="20" y="14" width="150" height="28"/>
    <text id="btn-main-text" x="95" y="32" text-anchor="middle">SAMPLE &#952;&#8242;</text>
  </g>
  <g id="btn-average" class="btn disabled">
    <rect x="178" y="14" width="96" height="28"/>
    <text x="226" y="32" text-anchor="middle">AVERAGE</text>
  </g>
  <g id="btn-reset" class="btn">
    <rect x="282" y="14" width="76" height="28"/>
    <text x="320" y="32" text-anchor="middle">RESET</text>
  </g>

  <!-- legend -->
  <g id="legend">
    <line x1="20" y1="66" x2="44" y2="66" stroke="var(--accent)" stroke-width="2"/>
    <text class="math-amber" x="52" y="70">p(&#952;)</text>
    <line x1="110" y1="66" x2="134" y2="66" stroke="var(--posterior)" stroke-width="2.5"/>
    <text class="math-red" x="142" y="70">p(&#952; | y&#8242;, d)</text>
  </g>

  <!-- current-run KL meter -->
  <g id="meter" visibility="hidden">
    <rect x="380" y="12" width="200" height="64" fill="#f6f6f4" stroke="var(--line)" stroke-width="1.5"/>
    <path fill="none" stroke="var(--posterior)" stroke-width="2"
          d="M 380 22 V 12 H 390 M 570 12 H 580 V 22 M 580 66 V 76 H 570 M 390 76 H 380 V 66"/>
    <text class="label" x="394" y="32">IG ( y&#8242;, d )</text>
    <text class="kl-val" id="kl-label" x="394" y="60">0.00</text>
  </g>

  <!-- stored runs -->
  <g id="runs"></g>
  <g id="eig-group" visibility="hidden">
    <line id="eig-rule" x1="700" y1="0" x2="860" y2="0" stroke="var(--line)" stroke-width="1.5"/>
    <text class="eig-val" id="eig-label" x="860" y="0" text-anchor="end">EIG &#8776; 0.00</text>
  </g>

  <!-- curves -->
  <path id="prior-fill" fill="var(--accent)" fill-opacity="0.10"/>
  <path id="prior" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <g id="post-group" visibility="hidden">
    <path id="post-fill" fill="var(--posterior)" fill-opacity="0.12"/>
    <path id="post" fill="none" stroke="var(--posterior)" stroke-width="2.5"/>
  </g>

  <!-- theta axis, extended to show the sensor design -->
  <line x1="40" y1="360" x2="835" y2="360" stroke="var(--line)" stroke-width="1.5"/>
  <g id="axis-ticks"></g>

  <!-- fixed sensor design -->
  <g id="sensor">
    <line x1="784" y1="250" x2="784" y2="360" stroke="var(--text)" stroke-width="2"/>
    <path d="M 773 234 L 795 234 L 784 250 Z" fill="var(--text)"/>
    <text class="label" x="784" y="384" text-anchor="middle">d</text>

    <rect x="719" y="170" width="130" height="52" fill="#f6f6f4" stroke="var(--line)" stroke-width="1.5"/>
    <path fill="none" stroke="var(--signal)" stroke-width="2"
          d="M 719 180 V 170 H 729 M 839 170 H 849 V 180 M 849 212 V 222 H 839 M 729 222 H 719 V 212"/>
    <text class="label" x="784" y="188" text-anchor="middle">y&#8242;</text>
    <text class="math-green" id="y-label" x="784" y="212" text-anchor="middle">&#8212;</text>
  </g>

  <!-- sampled world marker -->
  <g id="theta-group" visibility="hidden">
    <circle id="theta-dot" cy="360" r="6" fill="var(--accent)"/>
    <text class="math-amber" id="theta-label" y="410" text-anchor="middle">&#952;&#8242;</text>
  </g>

  <!-- transient animations -->
  <g id="fx"></g>
</svg>

<script>
(function () {
  "use strict";

  var svg = document.getElementById("scene");
  var ns = "http://www.w3.org/2000/svg";

  // --- geometry -----------------------------------------------------------
  var PX0 = 40, GROUND = 360;
  var PX_PER_U = 62;                       // theta axis extends past 10 to show d
  function tToPx(t) { return PX0 + t * PX_PER_U; }
  var PRIOR_H = 110;

  // --- model: identical to the information-gain widget ----------------------
  var COMP = [
    { w: 0.6, mu: 3.6, s: 1.1 },
    { w: 0.4, mu: 7.1, s: 0.75 }
  ];
  var D_SENSOR = 12, SIGMA_LOG = 0.5;
  function g(t) { return 1 / ((D_SENSOR - t) * (D_SENSOR - t)); }
  function priorPdf(t) {
    var p = 0;
    for (var i = 0; i < COMP.length; i++) {
      var c = COMP[i], z = (t - c.mu) / c.s;
      p += c.w * Math.exp(-0.5 * z * z) / (c.s * Math.sqrt(2 * Math.PI));
    }
    return p;
  }

  var GN = 600, TS = [], PRIOR = [], priorMax = 0, CDF = [];
  (function () {
    var sum = 0;
    for (var i = 0; i <= GN; i++) {
      var t = i / GN * 10;
      TS.push(t);
      var p = priorPdf(t);
      PRIOR.push(p);
      sum += p;
      CDF.push(sum);
    }
    for (var j = 0; j <= GN; j++) {
      PRIOR[j] /= sum;
      CDF[j] /= sum;
      priorMax = Math.max(priorMax, PRIOR[j]);
    }
  })();
  var SCALE = PRIOR_H / priorMax;

  function sampleTheta() {
    var u = Math.random(), lo = 0, hi = GN;
    while (hi - lo > 1) {
      var mid = (lo + hi) >> 1;
      if (CDF[mid] < u) lo = mid; else hi = mid;
    }
    return TS[hi];
  }
  function gauss() {
    var u1 = Math.random() || 1e-9, u2 = Math.random();
    return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  }
  function posterior(y) {
    var post = [], sum = 0, ly = Math.log(y);
    for (var i = 0; i <= GN; i++) {
      var z = (ly - Math.log(g(TS[i]))) / SIGMA_LOG;
      var m = PRIOR[i] * Math.exp(-0.5 * z * z);
      post.push(m);
      sum += m;
    }
    for (var j = 0; j <= GN; j++) post[j] /= sum;
    return post;
  }
  function klDivergence(post) {
    var kl = 0;
    for (var i = 0; i <= GN; i++) {
      if (post[i] > 1e-12) kl += post[i] * Math.log(post[i] / PRIOR[i]);
    }
    return kl;
  }

  // --- static drawing -------------------------------------------------------------
  function densPath(masses, closed) {
    var d = "M " + PX0 + " " + GROUND;
    for (var i = 0; i <= GN; i += 2) {
      var y = GROUND - Math.min(masses[i] * SCALE, 300);
      d += " L " + tToPx(TS[i]).toFixed(1) + " " + y.toFixed(1);
    }
    d += " L " + tToPx(10) + " " + GROUND;
    if (closed) d += " Z";
    return d;
  }
  document.getElementById("prior").setAttribute("d", densPath(PRIOR, false));
  document.getElementById("prior-fill").setAttribute("d", densPath(PRIOR, true));

  var ticks = document.getElementById("axis-ticks");
  for (var u = 0; u <= 10; u++) {
    var x = tToPx(u);
    var t = document.createElementNS(ns, "line");
    t.setAttribute("x1", x); t.setAttribute("x2", x);
    t.setAttribute("y1", GROUND); t.setAttribute("y2", GROUND + 6);
    t.setAttribute("stroke", "var(--line)");
    t.setAttribute("stroke-width", "1.5");
    ticks.appendChild(t);
    if (u % 2 === 0) {
      var n = document.createElementNS(ns, "text");
      n.setAttribute("class", "tick-num");
      n.setAttribute("x", x); n.setAttribute("y", GROUND + 24);
      n.setAttribute("text-anchor", "middle");
      n.textContent = "θ = " + u;
      ticks.appendChild(n);
    }
  }

  // --- element handles -----------------------------------------------------------
  var btnMain = document.getElementById("btn-main");
  var btnMainText = document.getElementById("btn-main-text");
  var btnAverage = document.getElementById("btn-average");
  var btnReset = document.getElementById("btn-reset");
  var meter = document.getElementById("meter");
  var klLabel = document.getElementById("kl-label");
  var runsGroup = document.getElementById("runs");
  var eigGroup = document.getElementById("eig-group");
  var eigRule = document.getElementById("eig-rule");
  var eigLabel = document.getElementById("eig-label");
  var postGroup = document.getElementById("post-group");
  var postEl = document.getElementById("post");
  var postFillEl = document.getElementById("post-fill");
  var thetaGroup = document.getElementById("theta-group");
  var thetaDot = document.getElementById("theta-dot");
  var thetaLabel = document.getElementById("theta-label");
  var yLabel = document.getElementById("y-label");
  var fx = document.getElementById("fx");

  // --- animation infra --------------------------------------------------------------
  var anims = [];   // {t, dur, step(p), done()}
  function animate(dur, step, done) {
    anims.push({ t: 0, dur: dur, step: step, done: done });
  }
  function easeInOut(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }

  // posterior morph state
  var postShown = null, postTarget = null;
  // KL count-up state
  var klShown = 0, klTarget = 0;

  var last = null;
  function frame(ts) {
    if (last === null) last = ts;
    var dt = ts - last;
    last = ts;

    for (var i = anims.length - 1; i >= 0; i--) {
      var a = anims[i];
      a.t += dt;
      var p = Math.min(1, a.t / a.dur);
      // a throwing animation is dropped (and unblocks the UI) instead of
      // killing the whole animation loop
      try {
        a.step(easeInOut(p));
        if (p >= 1) {
          anims.splice(i, 1);
          if (a.done) a.done();
        }
      } catch (err) {
        anims.splice(i, 1);
        busy = false;
      }
    }

    var k = 1 - Math.exp(-dt / 130);
    if (postShown && postTarget) {
      var moving = false;
      for (var j = 0; j <= GN; j++) {
        var d = postTarget[j] - postShown[j];
        if (Math.abs(d) > 1e-9) { postShown[j] += d * k; moving = true; }
      }
      if (moving) {
        postEl.setAttribute("d", densPath(postShown, false));
        postFillEl.setAttribute("d", densPath(postShown, true));
      }
    }
    if (Math.abs(klTarget - klShown) > 5e-4) {
      klShown += (klTarget - klShown) * k;
      klLabel.textContent = klShown.toFixed(2);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // --- state machine ------------------------------------------------------------------
  var phase = 0;          // 0 ready, 1 theta sampled, 2 y simulated, 3 posterior, 4 scored
  var busy = false;
  var thetaP = null, yP = null, klP = null;
  var runs = [];

  var PHASE_BTN = [
    { label: "SAMPLE θ′", cls: "btn amber" },
    { label: "SIMULATE y′", cls: "btn green" },
    { label: "POSTERIOR", cls: "btn red" },
    { label: "SCORE", cls: "btn red" },
    { label: "AGAIN", cls: "btn ink" }
  ];
  function setPhase(p) {
    phase = p;
    btnMainText.textContent = PHASE_BTN[p].label;
    btnMain.setAttribute("class", PHASE_BTN[p].cls);
  }
  function setAverageEnabled(on) {
    btnAverage.setAttribute("class", "btn" + (on ? " red" : " disabled"));
  }

  function fmtY(y) { return y.toFixed(3); }

  // step 1: drop a sampled world from the prior curve onto the axis
  function doSampleTheta() {
    thetaP = sampleTheta();
    var x = tToPx(thetaP);
    var mass = PRIOR[Math.round(thetaP / 10 * GN)];
    var y0 = GROUND - Math.min(mass * SCALE, 300) - 8;
    thetaDot.setAttribute("cx", x);
    thetaLabel.setAttribute("x", x);
    thetaLabel.textContent = "θ′ = " + thetaP.toFixed(2);
    thetaGroup.setAttribute("visibility", "visible");
    busy = true;
    animate(500, function (p) {
      thetaDot.setAttribute("cy", y0 + (GROUND - 6 - y0) * p);
    }, function () {
      thetaDot.setAttribute("cy", GROUND - 6);
      busy = false;
      setPhase(1);
    });
  }

  // step 2: the hypothetical source emits signal waves; when the wavefront
  // reaches the sensor, it records the green observation
  function doSimulateY() {
    yP = g(thetaP) * Math.exp(SIGMA_LOG * gauss());
    var xs = tToPx(thetaP), xSen = 784;
    var dist = xSen - xs;

    var N_ARCS = 4, arcs = [];
    for (var i = 0; i < N_ARCS; i++) {
      var a = document.createElementNS(ns, "path");
      a.setAttribute("fill", "none");
      a.setAttribute("stroke", "var(--accent)");
      a.setAttribute("stroke-width", "2");
      fx.appendChild(a);
      arcs.push(a);
    }
    function arcPath(r) {
      return "M " + (xs - r) + " " + GROUND + " A " + r + " " + r + " 0 0 1 " + (xs + r) + " " + GROUND;
    }

    busy = true;
    animate(1000, function (p) {
      for (var i = 0; i < N_ARCS; i++) {
        var f = p - i * 0.13;                    // trailing wave train
        if (f <= 0) { arcs[i].setAttribute("opacity", "0"); continue; }
        var r = Math.max(1, f * dist);
        arcs[i].setAttribute("d", arcPath(r));
        var o = Math.min(1, f * 6) * (1 - f) * 0.9;
        arcs[i].setAttribute("opacity", Math.max(0, o).toFixed(3));
      }
    }, function () {
      arcs.forEach(function (a) { a.remove(); });
      yLabel.textContent = "y′ = " + fmtY(yP);
      // green ripple at the sensor as it records the reading
      var ripple = document.createElementNS(ns, "circle");
      ripple.setAttribute("cx", xSen);
      ripple.setAttribute("cy", 242);
      ripple.setAttribute("fill", "none");
      ripple.setAttribute("stroke", "var(--signal)");
      ripple.setAttribute("stroke-width", "2");
      fx.appendChild(ripple);
      animate(320, function (p) {
        ripple.setAttribute("r", 2 + 16 * p);
        ripple.setAttribute("opacity", (1 - p).toFixed(3));
      }, function () {
        ripple.remove();
        busy = false;
        setPhase(2);
      });
    });
  }

  // step 3: posterior morphs out of the prior
  function doPosterior() {
    postShown = PRIOR.slice();
    postTarget = posterior(yP);
    postEl.setAttribute("d", densPath(postShown, false));
    postFillEl.setAttribute("d", densPath(postShown, true));
    postGroup.setAttribute("visibility", "visible");
    setPhase(3);
  }

  // step 4: score it
  function doScore() {
    klP = klDivergence(postTarget);
    klShown = 0;
    klTarget = klP;
    klLabel.textContent = "0.00";
    meter.setAttribute("visibility", "visible");
    setPhase(4);
  }

  // step 5: bank the score on the right, reset the stage
  function runSlotY(i) { return 26 + i * 24; }

  function doAgain() {
    var i = runs.length;
    var score = klP;               // capture before the stage is cleared below
    runs.push(score);

    // flying copy of the score
    var flyer = document.createElementNS(ns, "text");
    flyer.setAttribute("class", "ig-entry");
    flyer.setAttribute("text-anchor", "end");
    flyer.setAttribute("x", 452); flyer.setAttribute("y", 60);
    flyer.textContent = score.toFixed(2);
    fx.appendChild(flyer);
    var x0 = 452, y0 = 60, x1 = 860, y1 = runSlotY(i);
    busy = true;
    animate(550, function (p) {
      flyer.setAttribute("x", x0 + (x1 - x0) * p);
      flyer.setAttribute("y", y0 + (y1 - y0) * p);
    }, function () {
      flyer.remove();
      var entry = document.createElementNS(ns, "text");
      entry.setAttribute("class", "ig-entry");
      entry.setAttribute("x", 860); entry.setAttribute("y", runSlotY(i));
      entry.setAttribute("text-anchor", "end");
      entry.textContent = "IG" + subscript(i + 1) + " = " + score.toFixed(2);
      runsGroup.appendChild(entry);
      busy = false;
      setAverageEnabled(runs.length >= 2);
    });

    // clear the stage
    meter.setAttribute("visibility", "hidden");
    postGroup.setAttribute("visibility", "hidden");
    postShown = null; postTarget = null;
    thetaGroup.setAttribute("visibility", "hidden");
    yLabel.textContent = "—";
    thetaP = null; yP = null; klP = null;
    setPhase(0);
  }

  function subscript(n) {
    var map = { "0": "₀", "1": "₁", "2": "₂", "3": "₃", "4": "₄", "5": "₅", "6": "₆", "7": "₇", "8": "₈", "9": "₉" };
    return String(n).split("").map(function (c) { return map[c] || c; }).join("");
  }

  function doAverage() {
    if (runs.length < 2) return;
    var mean = runs.reduce(function (a, b) { return a + b; }, 0) / runs.length;
    var y = runSlotY(runs.length) + 4;
    eigRule.setAttribute("y1", y - 14); eigRule.setAttribute("y2", y - 14);
    eigLabel.setAttribute("y", y + 6);
    eigLabel.textContent = "EIG ≈ " + mean.toFixed(2);
    eigGroup.setAttribute("visibility", "visible");
  }

  // --- wiring ------------------------------------------------------------------------
  btnMain.addEventListener("click", function () {
    if (busy) return;
    if (phase === 0) doSampleTheta();
    else if (phase === 1) doSimulateY();
    else if (phase === 2) doPosterior();
    else if (phase === 3) doScore();
    else if (phase === 4) doAgain();
  });
  btnAverage.addEventListener("click", doAverage);
  btnReset.addEventListener("click", function () {
    anims = [];
    while (fx.firstChild) fx.firstChild.remove();
    while (runsGroup.firstChild) runsGroup.firstChild.remove();
    runs = [];
    eigGroup.setAttribute("visibility", "hidden");
    meter.setAttribute("visibility", "hidden");
    postGroup.setAttribute("visibility", "hidden");
    postShown = null; postTarget = null;
    thetaGroup.setAttribute("visibility", "hidden");
    yLabel.textContent = "—";
    thetaP = null; yP = null; klP = null;
    busy = false;
    setAverageEnabled(false);
    setPhase(0);
  });

  setPhase(0);

  // hash hook: #demo auto-steps through three full runs, then averages
  if (location.hash === "#demo") {
    var driver = setInterval(function () {
      if (busy) return;
      if (runs.length >= 3 && phase === 0) {
        doAverage();
        clearInterval(driver);
        return;
      }
      btnMain.dispatchEvent(new Event("click"));
    }, 450);
  }
})();
</script>
</body>
</html>
